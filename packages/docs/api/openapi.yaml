openapi: 3.1.0
info:
  title: Charan Interiors & Openedup Analytics API
  description: High-performance, modular enterprise API for expense & receipts analytics, AI document segmentation, benchmarks, and chat.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.charaninteriors.com
    description: Production gateway

paths:
  /healthz:
    get:
      summary: Liveness Probe
      description: Returns HTTP 200 with process uptime when the server process is alive.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    example: 12.34
                  timestamp:
                    type: string
                    format: date-time

  /readyz:
    get:
      summary: Readiness Probe
      description: Returns HTTP 200 when all critical internal dependencies and configurations are resolved.
      responses:
        "200":
          description: Service is ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      geminiApiKeyConfigured:
                        type: boolean
                        example: true
                      firebaseConfigured:
                        type: boolean
                        example: true

  /api/workspace-config:
    get:
      summary: Get Workspace Configuration
      description: Returns client configuration for Firebase applet and API key status without leaking secrets.
      responses:
        "200":
          description: Workspace configuration details.

  /api/benchmarks:
    get:
      summary: Get AI Model Benchmarks
      description: Returns frontier model intelligence and coding benchmarks metadata.
      responses:
        "200":
          description: List of benchmarked models and provider capability scores.

  /api/logs:
    get:
      summary: Retrieve Recent Observability Logs
      description: Returns recent in-memory and disk structured logs formatted with Pino.
      responses:
        "200":
          description: Array of structured log entries.

  /api/check-duplicates:
    post:
      summary: Detect Receipt Duplicates
      description: Runs code-verified multi-pass fuzzy duplicate detection against receipt line items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rows
              properties:
                rows:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Deduped receipts with duplicate_of and duplicate_reason annotations.
        "400":
          description: Invalid request payload.

  /api/read-receipts:
    post:
      summary: Multi-Photo Receipt Vision OCR & Ingestion
      description: Batched multimodal ingestion of receipt images using Gemini Flash / Pro with cascading fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - photos
              properties:
                photos:
                  type: array
                  items:
                    type: object
                    required:
                      - globalIndex
                      - totalPhotos
                      - base64Data
                    properties:
                      globalIndex:
                        type: integer
                      totalPhotos:
                        type: integer
                      mimeType:
                        type: string
                      base64Data:
                        type: string
      responses:
        "200":
          description: Extracted receipts and metadata.
        "400":
          description: Invalid photo payload or validation failure.

  /api/parse-pdf-chapters:
    post:
      summary: Segment PDF into Logical Chapters
      description: Parses and validates hierarchical document chapters with automated page gap repair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - base64Data
              properties:
                mimeType:
                  type: string
                  default: application/pdf
                base64Data:
                  type: string
                fileName:
                  type: string
      responses:
        "200":
          description: Parsed PDF chapter boundaries, summaries, and key topics.
        "400":
          description: Invalid PDF file or corrupted byte header.

  /api/chat:
    post:
      summary: Multi-provider document and project chat
      description: Routes a conversation to the selected provider using a signed-in account credential, one-request BYOK key, or server configuration.
      parameters:
        - in: header
          name: x-provider-key
          schema:
            type: string
          description: Optional one-request provider key. Saved account credentials are resolved server-side and are never returned to the client.
        - in: header
          name: x-provider-base-url
          schema:
            type: string
            format: uri
          description: Optional custom endpoint for the custom provider. Private endpoints are restricted outside development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 40000
                context:
                  type: object
                  properties:
                    docTitle:
                      type: string
                    projectInstructions:
                      type: string
                      maxLength: 20000
                    projectFiles:
                      type: array
                      maxItems: 100
                      items:
                        type: string
                        maxLength: 500
                    chapters:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        required: [title]
                        properties:
                          title:
                            type: string
                            maxLength: 500
                          summary:
                            type: string
                            maxLength: 4000
                          pageRange:
                            type: string
                            maxLength: 100
                model:
                  type: string
                  maxLength: 200
                customModel:
                  type: string
                  maxLength: 200
                  description: Required when model is custom-model.
                customProvider:
                  type: string
                  enum: [anthropic, openai, google, deepseek, kimi, qwen, xai, custom]
                  description: Provider whose user-supplied key and endpoint are used for a custom model.
                effort:
                  type: string
                  enum: [Low, Medium, High, Extra, Max]
      responses:
        "200":
          description: Generated assistant response.
        "401":
          description: A user-supplied API key is required for the selected provider.
        "400":
          description: Validation error.

  /api/chat/stream:
    post:
      summary: Stream a chat response as server-sent events
      description: Emits step, token, done, or error events as provider output arrives.
      parameters:
        - in: header
          name: x-provider-key
          schema:
            type: string
        - in: header
          name: x-provider-base-url
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                        maxLength: 40000
                model:
                  type: string
                customModel:
                  type: string
                customProvider:
                  type: string
                  enum: [anthropic, openai, google, deepseek, kimi, qwen, xai, custom]
                effort:
                  type: string
                  enum: [Low, Medium, High, Extra, Max]
                context:
                  type: object
      responses:
        "200":
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Validation error.

  /api/chat/chapter:
    post:
      summary: Answer using evidence from one selected PDF chapter
      description: Validates the selected chapter's page bounds and evidence, then returns a grounded answer with citations mapped to submitted evidence IDs.
      parameters:
        - in: header
          name: x-provider-key
          schema:
            type: string
        - in: header
          name: x-provider-base-url
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterChatRequest"
      responses:
        "200":
          description: Grounded chapter answer, validated citations, and abstention state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterChatResult"
        "400":
          description: Invalid request or evidence outside the selected chapter.
        "401":
          description: A user-supplied API key is required for the selected provider.

  /api/chat/chapter/stream:
    post:
      summary: Stream a grounded answer about one selected PDF chapter
      description: Emits thinking/responding phase events followed by a validated done result, or an actionable error event. Disconnects and request timeouts cancel provider generation.
      parameters:
        - in: header
          name: x-provider-key
          schema:
            type: string
        - in: header
          name: x-provider-base-url
          schema:
            type: string
            format: uri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterChatRequest"
      responses:
        "200":
          description: Server-sent event stream with phase, done, or error events.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request or evidence outside the selected chapter.
        "401":
          description: A user-supplied API key is required for the selected provider.

  /api/chat/rules:
    get:
      summary: Read workspace instructions
      responses:
        "200":
          description: Current project and global instruction text.
    post:
      summary: Save workspace instructions
      description: Writes OPENEDUP.md or global AGENTS.md and is restricted to local development requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [project, global]
                  default: project
                content:
                  type: string
                  maxLength: 20000
      responses:
        "200":
          description: Saved instructions.
        "403":
          description: Workspace rules can only be changed from a local development session.

  /api/chat/skills:
    get:
      summary: List server-owned skills
      responses:
        "200":
          description: Versioned skill definitions and bounded tool identifiers.

  /api/conversations:
    get:
      summary: List the authenticated user's conversations
      security: [{ FirebaseBearer: [] }]
      responses:
        "200": { description: Owner-scoped conversation summaries. }
        "401": { description: Firebase ID token is missing or invalid. }
    post:
      summary: Create a conversation for the authenticated user
      security: [{ FirebaseBearer: [] }]
      responses:
        "201": { description: Created conversation. }

  /api/conversations/{id}:
    get:
      summary: Read an owned conversation and its ordered messages
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Conversation and messages. }
        "404": { description: Conversation is not owned by the caller. }
    patch:
      summary: Rename, pin, or archive an owned conversation
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated conversation. }
    delete:
      summary: Delete an owned conversation
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }

  /api/artifacts:
    get:
      summary: List owned and authenticated-shared artifacts
      security: [{ FirebaseBearer: [] }]
      responses:
        "200": { description: Owner artifacts and artifacts shared with signed-in users. }
    post:
      summary: Create an owned artifact
      security: [{ FirebaseBearer: [] }]
      responses:
        "201": { description: Created artifact. }

  /api/artifacts/{id}:
    put:
      summary: Update an owned artifact's title, category, content, and sharing state
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated artifact. }
        "404": { description: Artifact is not owned by the caller. }
    delete:
      summary: Delete an owned artifact
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }

  /api/artifacts/{id}/organization:
    patch:
      summary: Update account-synced organization metadata without creating a content version
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                isFavorite: { type: boolean }
                collection: { type: [string, "null"], minLength: 1, maxLength: 80 }
                tags:
                  type: array
                  maxItems: 12
                  items: { type: string, minLength: 1, maxLength: 32 }
      responses:
        "200": { description: Updated organization metadata. }
        "404": { description: Artifact is not owned by the caller. }

  /api/artifacts/{id}/versions:
    get:
      summary: List the 50 most recent versions of an owned artifact
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Version history. }
        "404": { description: Artifact is not owned by the caller. }

  /api/artifacts/import:
    post:
      summary: Idempotently import browser artifacts
      security: [{ FirebaseBearer: [] }]
      responses:
        "200": { description: Imported and skipped counts. }

  /api/artifacts/{id}/share:
    put:
      summary: Change authenticated sharing on an owned artifact
      security: [{ FirebaseBearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated sharing state. }
        "404": { description: Artifact is not owned by the caller. }

  /api/credentials:
    get:
      summary: List saved provider IDs without returning key material
      security: [{ FirebaseBearer: [] }]
      responses:
        "200": { description: Configured providers for the authenticated account. }
    put:
      summary: Encrypt and save a provider credential
      security: [{ FirebaseBearer: [] }]
      responses:
        "204": { description: Credential saved. }
    patch:
      summary: Update the endpoint for an existing provider credential without returning its key
      security: [{ FirebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, baseUrl]
              properties:
                provider:
                  type: string
                  enum: [anthropic, openai, google, deepseek, kimi, qwen, xai, custom]
                baseUrl:
                  type: string
                  minLength: 1
                  maxLength: 2048
      responses:
        "204": { description: Endpoint saved; existing key remains encrypted at rest. }
        "400": { description: Invalid endpoint request. }
        "404": { description: No saved credential exists for this provider. }

  /api/projects:
    get:
      summary: List the caller's projects with nested sessions and files
      security: [{ FirebaseBearer: [] }]
      responses:
        "200": { description: Account-owned project snapshots. }
    put:
      summary: Replace the caller's project snapshot collection
      description: Replaces only the authenticated user's projects. Project and session history is validated and bounded by the shared project schemas.
      security: [{ FirebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projects]
              properties:
                projects:
                  type: array
                  maxItems: 100
      responses:
        "200": { description: Saved project snapshots. }
        "400": { description: Invalid or oversized project snapshot. }
  /api/projects/import:
    post:
      summary: Idempotently import legacy browser projects
      security: [{ FirebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projects]
              properties:
                projects:
                  type: array
                  maxItems: 100
      responses:
        "200": { description: Imported and skipped project counts. }
        "400": { description: Invalid or oversized project snapshot. }

  /api/scheduled-tasks:
    get:
      summary: List scheduled tasks
      description: Returns schedules with server-calculated next run times. Unauthenticated callers default to user "default".
      security: []
      responses:
        "200": { description: Scheduled tasks with server-calculated next run times. }
    post:
      summary: Create a scheduled task
      description: Persists a scheduled task. Executes autonomously on the background worker using saved credentials, custom task key, or fallback env keys.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledTaskInput" }
      responses:
        "201": { description: Created schedule. }
        "400": { description: Invalid schedule or unknown model ID. }
  /api/scheduled-tasks/import:
    post:
      summary: Idempotently import browser schedules
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tasks]
              properties:
                tasks:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/ScheduledTaskImport" }
      responses:
        "200": { description: Imported and skipped task counts. }
        "400": { description: Invalid task data. }
  /api/scheduled-tasks/{id}:
    put:
      summary: Replace a scheduled task
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduledTaskInput" }
      responses:
        "200": { description: Updated task. }
        "404": { description: Task not found. }
    delete:
      summary: Delete a scheduled task and its run history
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Task deleted. }
        "404": { description: Task not found. }
  /api/scheduled-tasks/{id}/run:
    post:
      summary: Queue an immediate task run
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Queued run; instantly dispatched to background worker. }
        "404": { description: Task not found. }
  /api/scheduled-tasks/{id}/runs:
    get:
      summary: List recent runs for one task
      security: []
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Recent run records with outputs and durations. }
        "404": { description: Task not found. }
  /api/scheduled-tasks/runs/{runId}:
    get:
      summary: Read a task run
      security: []
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Run status, model output, or safe error. }
        "404": { description: Run not found. }

components:
  schemas:
    ScheduledTaskInput:
      type: object
      required:
        [
          title,
          prompt,
          icon,
          frequency,
          time,
          timezone,
          isActive,
          model,
          effort,
          notifications,
          startInNewChat,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        prompt: { type: string, minLength: 1, maxLength: 40000 }
        icon: { type: string, maxLength: 32 }
        frequency: { type: string, enum: [daily, weekdays, weekly, monthly] }
        time: { type: string, pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        timezone: { type: string, maxLength: 100, example: Asia/Kolkata }
        dayOfWeek:
          {
            type: integer,
            minimum: 0,
            maximum: 6,
            description: Sunday is 0. Required for weekly schedules.,
          }
        dayOfMonth:
          {
            type: integer,
            minimum: 1,
            maximum: 31,
            description: Required for monthly schedules; shorter months clamp to their last day.,
          }
        isActive: { type: boolean }
        model: { type: string, description: Canonical model ID from the model registry. }
        effort: { type: string, enum: [Low, Medium, High] }
        notifications: { type: string, enum: [Important updates, Failed runs only] }
        startInNewChat: { type: boolean }
    ScheduledTaskImport:
      allOf:
        - { $ref: "#/components/schemas/ScheduledTaskInput" }
        - type: object
          required: [legacyId, createdAt]
          properties:
            legacyId: { type: string, minLength: 1, maxLength: 200 }
            createdAt: { type: integer, minimum: 0 }
    ScheduledTaskRun:
      type: object
      required:
        [
          id,
          taskId,
          trigger,
          status,
          scheduledFor,
          createdAt,
          startedAt,
          finishedAt,
          output,
          error,
          modelUsed,
          providerUsed,
          conversationId,
        ]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        trigger: { type: string, enum: [scheduled, manual] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        scheduledFor: { type: integer, nullable: true }
        createdAt: { type: integer }
        startedAt: { type: integer, nullable: true }
        finishedAt: { type: integer, nullable: true }
        output: { type: string, nullable: true }
        error: { type: string, nullable: true }
        modelUsed: { type: string, nullable: true }
        providerUsed: { type: string, nullable: true }
        conversationId: { type: string, format: uuid, nullable: true }
    ChapterChatRequest:
      type: object
      additionalProperties: false
      required: [chapterId, chapterTitle, startPage, endPage, question, model, history, evidence]
      properties:
        chapterId: { type: string, minLength: 1, maxLength: 200 }
        chapterTitle: { type: string, minLength: 1, maxLength: 300 }
        startPage: { type: integer, minimum: 1 }
        endPage: { type: integer, minimum: 1 }
        question: { type: string, minLength: 1, maxLength: 8000 }
        model: { type: string, minLength: 1, maxLength: 200 }
        customModel: { type: string, maxLength: 200 }
        customProvider:
          { type: string, enum: [anthropic, openai, google, deepseek, kimi, qwen, xai, custom] }
        effort: { type: string, enum: [Low, Medium, High, Extra, Max] }
        history:
          type: array
          maxItems: 12
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1, maxLength: 40000 }
        evidence:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required: [id, pageNumber, text]
            properties:
              id: { type: string, minLength: 1, maxLength: 300 }
              pageNumber: { type: integer, minimum: 1 }
              text: { type: string, minLength: 1, maxLength: 8000 }
        imagePages:
          type: array
          maxItems: 8
          items:
            type: object
            required: [pageNumber, mimeType, base64Data]
            properties:
              pageNumber: { type: integer, minimum: 1 }
              mimeType: { type: string, enum: [image/jpeg, image/png] }
              base64Data: { type: string, minLength: 1, maxLength: 1500000 }
    ChapterChatResult:
      type: object
      required: [answer, citations, abstained, modelUsed, providerUsed]
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            required: [id, pageNumber]
            properties:
              id: { type: string }
              pageNumber: { type: integer, minimum: 1 }
        abstained: { type: boolean }
        modelUsed: { type: string }
        providerUsed: { type: string }
        status: { type: string, enum: [generation-error] }
        error: { type: string }
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
