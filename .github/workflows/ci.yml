name: CI

on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.12.0]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Formatting
        run: npm run format:check

      - name: Static Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: python -m pip install -e "./python[dev,mupdf]"

      - name: Test Python Tools
        run: python -m unittest discover -s python/tests -v

      - name: Lint Python
        run: ruff check python

      - name: Check Feature Import Boundaries
        run: npm run check:feature-boundaries

      - name: Linting
        run: npm run lint

      - name: Build Application
        run: npm run build
