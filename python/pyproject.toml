[project]
name = "charan-interiors-tools"
version = "0.1.0"
description = "PDF chapter extraction and roadmap generation utilities"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]
mupdf = [
    "pymupdf>=1.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
